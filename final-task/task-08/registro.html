<!doctype html>
<html lang="">
    <head>
        <!-- Título para el navegador y los buscadores -->
        <title>Registrate con nosotros| Academia Conquerblocks</title>

        <!-- Descripción de la página para los buscadores -->
        <meta
            name="description"
            content="Registrate en nuestra academia y accede a nuestros cursos de desarrollo web"
        />

        <!-- Autor de la página -->
        <meta name="author" content="maleorchards22" />

        <!-- Favicon de la página -->
        <link rel="icon" href="favicon.ico" type="image/x-icon" />

        <!-- Codificación-->
        <meta charset="UTF-8" />

        <!-- Para que la web sea responsive -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <!-- Para algunos navegadores móviles -->
        <meta name="theme-color" content="#1e7bbf" />
    </head>

    <body>
        <header>
            <figure>
                <img
                    width="150"
                    src="img/common/logo-conquer.png"
                    alt="Logotipo de conquer blocks"
                />
            </figure>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="quienes-somos.html">Quiénes Somos</a></li>
                    <li><a href="cursos.html">Cursos</a></li>
                    <li><a href="blog.html">Blog</a></li>
                    <li><a href="registro.html">Registro</a></li>
                    <li><a href="login.html">Login</a></li>
                    <li><a href="contacto.html">Contacto</a></li>
                </ul>
            </nav>
            <hr />
        </header>
        <main>
            <section>
                <h1>Registro</h1>
                <p>
                    Registrate a nuestra academia y accede a nuestros cursos de
                    desarrollo web.
                </p>
                <form action="#" method="post" enctype="multipart/form-data">
                    <div>
                        <label for="name">Nombre completo</label>
                        <input type="text" name="name" id="name" required />
                    </div>
                    <div>
                        <label for="birthday">Fecha de nacimiento</label>
                        <input
                            type="date"
                            name="birthday"
                            id="birthday"
                            required
                        />
                    </div>
                    <div>
                        <label for="email">Correo electrónico</label>
                        <input type="email" name="email" id="email" required />
                    </div>
                    <div>
                        <label for="address">Dirección</label>
                        <input type="text" name="address" id="address" />
                    </div>
                    <div>
                        <label for="web">Página web</label>
                        <input type="url" name="web" id="web" />
                    </div>
                    <div>
                        <label for="photo">Foto</label>
                        <input type="file" name="photo" id="photo" />
                    </div>
                    <div>
                        <label for="bio">Biografía</label> <br />
                        <textarea
                            name="bio"
                            id="bio"
                            cols="30"
                            rows="5"
                        ></textarea>
                    </div>
                    <div>
                        <button>Enviar</button>
                        <input type="reset" value="Borrar formulario" />
                    </div>
                </form>
            </section>
        </main>
        <footer>
            <hr />
            <p>
                &copy; Academia Conquerblocks 2026 -
                <a href="aviso-legal.html">Aviso Legal</a>
            </p>
        </footer>
    </body>
</html>
