<!doctype html>
<html lang="es">
    <head>
        <!-- Título para el navegador y los buscadores -->
        <title>Clase 9- Tablas Avanzadas en HTML</title>

        <!-- Descripción de la página para los buscadores -->
        <meta
            name="description"
            content="Página de ejemplos vistos en la clase 9: Tablas Avanzadas en HTML"
        />

        <!-- Palabras clave para los buscadores -->
        <meta name="keywords" content="table, tr, td, th, colspan, rowspan" />

        <!-- Autor de la página -->
        <meta name="author" content="maleorchards22" />

        <!-- Favicon de la página -->
        <link rel="icon" href="favicon.ico" type="image/x-icon" />

        <!-- Codificación-->
        <meta charset="UTF-8" />

        <!-- Para que la web sea responsive -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <!-- Para algunos navegadores móviles -->
        <meta name="theme-color" content="#1e7bbf" />
    </head>

    <body>
        <h2>Ejercicio 5: Tabla con rowspan y colspan en HTML</h2>
        <a href="index.html">Volver atrás 👈</a>
        <hr />

        <table border="1">
            <caption>
                Análisis de ventas anuales
            </caption>
            <tr>
                <th rowspan="2">AÑO</th>
                <th colspan="4">Expansión de ventas</th>
            </tr>
            <tr>
                <th>Producto A</th>
                <th>Producto B</th>
                <th>Producto C</th>
                <th>Producto D</th>
            </tr>
            <tr>
                <th>N-3</th>
                <td>-</td>
                <td>-</td>
                <td>-</td>
                <td>-</td>
            </tr>
            <tr>
                <th>N-2</th>
                <td>3</td>
                <td>5</td>
                <td>8</td>
                <td>4</td>
            </tr>
            <tr>
                <th>N-1</th>
                <td>4</td>
                <td>4</td>
                <td>7</td>
                <td>3</td>
            </tr>
            <tr>
                <th>N</th>
                <td>5</td>
                <td>7</td>
                <td>6</td>
                <td>2</td>
            </tr>
            <tr>
                <th rowspan="2">AÑO</th>
                <th>Producto A</th>
                <th>Producto B</th>
                <th>Producto C</th>
                <th>Producto D</th>
            </tr>
            <tr>
                <th colspan="4">Expansión de ventas</th>
            </tr>
        </table>
    </body>
</html>
