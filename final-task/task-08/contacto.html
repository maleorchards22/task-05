        <!-- Para algunos navegadores móviles -->

    <body>
        <header>
            <figure>
                <img
                    width="150"
                    src="img/common/logo-conquer.png"
                    alt="Logotipo de conquer blocks"
                />
            </figure>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="quienes-somos.html">Quiénes Somos</a></li>

            <hr />
        </header>
        <main>
            <h1>Contacto</h1>
            <p>
                Escríbenos si tienes dudas sobre los cursos, el acceso o la
                academia.
            </p>
            <section>
                <h2>Formulario</h2>
                <form action="#" method="post">
                    <div>
                        <label for="name">Nombre completo</label>
                        <input type="text" name="name" id="name" required />
                    </div>
                    <div>
                        <label for="email">Correo electrónico</label>
                        <input type="email" name="email" id="email" required />
                    </div>
                    <div>
                        <label for="comments">Comentarios</label> <br />
                        <textarea
                            name="comment"
                            id="comments"
                            cols="30"
                            rows="5"
                        ></textarea>
                    </div>
                    <div>
                        <button>Enviar</button>
                        <input type="reset" value="Borrar formulario" />
                    </div>
                </form>
            </section>
            <section>
                <h2>Nuestra ubicación</h2>
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d1590.1374022616253!2d-3.613959253652233!3d37.14616472430474!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1ses!2ses!4v1688535349624!5m2!1ses!2ses"
                    width="500"
                    height="300"
                    style="border: 0"
                    allowfullscreen=""
                    loading="lazy"
                    referrerpolicy="no-referrer-when-downgrade"
                ></iframe>
            </section>
        </main>
