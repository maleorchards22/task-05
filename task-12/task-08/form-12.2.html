<!doctype html>
<html lang="es">
    <head>
        <!-- Título para el navegador y los buscadores -->
        <title>Clase 12- Formularios en HTML</title>

        <!-- Descripción de la página para los buscadores -->
        <meta
            name="description"
            content="Página de ejemplos vistos en la clase 12: Formularios en HTML"
        />

        <!-- Palabras clave para los buscadores -->
        <meta name="keywords" content="form, input, button, select" />

        <!-- Autor de la página -->
        <meta name="author" content="maleorchards22" />

        <!-- Favicon de la página -->
        <link rel="icon" href="favicon.ico" type="image/x-icon" />

        <!-- Codificación-->
        <meta charset="UTF-8" />

        <!-- Para que la web sea responsive -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <!-- Para algunos navegadores móviles -->
        <meta name="theme-color" content="#1e7bbf" />
    </head>

    <body>
        <header>
            <h2>Ejercicio Formulario 12.2</h2>
            <a href="index.html">Volver atrás 👈</a>
            <hr />
        </header>

        <main>
            <h3>Formulario estructurado</h3>
            <form action="" method="get">
                <fieldset>
                    <legend>Datos personales</legend>

                    <p>
                        <label for="name">Nombres</label> <br />
                        <input type="text" name="nombre" id="name" />
                    </p>
                    <p>
                        <label for="lastname">Apellidos</label> <br />
                        <input type="text" name="apellidos" id="lastname" />
                    </p>
                    <p>
                        <label for="dni">DNI</label> <br />
                        <input
                            type="text"
                            name="dni"
                            id="dni"
                            maxlenght="10"
                            size="10"
                        />
                    </p>
                </fieldset>
                <fieldset>
                    <legend>Datos de conexión</legend>
                    <p>
                        <label for="username">Nombre de usuario</label> <br />
                        <input
                            type="text"
                            name="usuario"
                            id="username"
                            maxlenght="20"
                        />
                    </p>
                    <p>
                        <label for="password1">Contraseña</label> <br />
                        <input
                            type="password"
                            name="contrasena"
                            id="password1"
                            maxlenght="20"
                        />
                    </p>
                    <p>
                        <label for="password2">Repite la contraseña</label>
                        <br />
                        <input
                            type="password"
                            name="recontrasena"
                            id="password2"
                            maxlenght="20"
                        />
                    </p>
                </fieldset>
                <p>
                    <button type="submit">Enviar</button>
                </p>
            </form>
        </main>
    </body>
</html>
