<!doctype html>
<html lang="es">
    <head>
        <!-- Título para el navegador y los buscadores -->
        <title>Clase 12- Formularios en HTML</title>

        <!-- Descripción de la página para los buscadores -->
        <meta
            name="description"
            content="Página de ejemplos vistos en la clase 12: Formularios en HTML"
        />

        <!-- Palabras clave para los buscadores -->
        <meta name="keywords" content="form, input, button, select" />

        <!-- Autor de la página -->
        <meta name="author" content="maleorchards22" />

        <!-- Favicon de la página -->
        <link rel="icon" href="favicon.ico" type="image/x-icon" />

        <!-- Codificación-->
        <meta charset="UTF-8" />

        <!-- Para que la web sea responsive -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <!-- Para algunos navegadores móviles -->
        <meta name="theme-color" content="#1e7bbf" />
    </head>

    <body>
        <header>
            <h2>Ejercicio Formulario 12.4</h2>
            <a href="index.html">Volver atrás 👈</a>
            <hr />
        </header>

        <main>
            <h3>Información sobre el producto</h3>
            <form action="" method="post" enctype="multipart/form-data">
                <fieldset>
                    <legend>Datos básicos</legend>
                    <p>
                        <label for="name">Nombre</label> <br />
                        <input type="text" name="nombre" id="name" />
                    </p>

                    <p>
                        <label for="description">Descripción</label> <br />
                        <textarea
                            name="descripcion"
                            id="description"
                            cols="30"
                            rows="10"
                            
                        ></textarea>
                    </p>
                    <p>
                        <label for="photo">Foto</label>
                        <input type="file" name="foto" id="photo"
                    </p>
                    <p>
                        <input type="checkbox" name="counter" id="counter" />
                        <label for="counter">Añadir contador de visitas</label>
                    </p>
                </fieldset>
                <fieldset>
                    <legend>Datos económicos</legend>
                    <p>
                        <label for="price">Precio</label> $
                        <input type="number" name="precio" id="price"> 
                        <label for="taxes">Impuestos</label>
                        <select name="impuestos" id="taxes">
                            <option value="">-seleccionar-</option>
                            <option value="4">4%</option>
                            <option value="7">7%</option>
                            <option value="16">16%</option>
                            <option value="25">25%</option>
                            
                        </select>
                    </p>
                    <div>
                        Promoción <br>
                        <p>
                        <input type="radio" name="promo" value="" id="none">
                        <label for="none">Ninguno</label>

                    </p>
                    <p>
                        <input type="radio" name="promo" value="free" id="trasporte">
                        <label for="trasporte">Transporte gratuito</label>

                    </p>
                    <p>
                        <input type="radio" name="promo" value="discount" id="descuento">
                        <label for="descuento">Descuento del 5%</label>

                    </p>
                </fieldset>

                <p>
                    <button type="submit">Enviar</button>
                </p>
            </form>
        </main>
    </body>
</html>
