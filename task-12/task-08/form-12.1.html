<!doctype html>
<html lang="es">
    <head>
        <!-- Título para el navegador y los buscadores -->
        <title>Clase 12- Formularios en HTML</title>

        <!-- Descripción de la página para los buscadores -->
        <meta
            name="description"
            content="Página de ejemplos vistos en la clase 12: Formularios en HTML"
        />

        <!-- Palabras clave para los buscadores -->
        <meta name="keywords" content="form, input, button, select" />

        <!-- Autor de la página -->
        <meta name="author" content="maleorchards22" />

        <!-- Favicon de la página -->
        <link rel="icon" href="favicon.ico" type="image/x-icon" />

        <!-- Codificación-->
        <meta charset="UTF-8" />

        <!-- Para que la web sea responsive -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <!-- Para algunos navegadores móviles -->
        <meta name="theme-color" content="#1e7bbf" />
    </head>

    <body>
        <header>
            <h2>Ejercicio Formularios 12.1</h2>
            <a href="index.html">Volver atrás 👈</a>
            <hr />
        </header>

        <main>
            <h3>Formulario de registro- Mi web</h3>
            <form action="" method="get">
                <p>
                    <label for="name">Nombres</label>
                    <input type="text" name="nombre" id="name" maxlenght="50" />
                </p>
                <p>
                    <label for="lastname">Apellidos</label>
                    <input
                        type="text"
                        name="apellidos"
                        id="lastname"
                        maxlenght="50"
                    />
                </p>
                <p>
                    Sexo: <br />
                    <input
                        type="radio"
                        name="sex"
                        value="masculino"
                        id="male"
                    />
                    <label for="male">Masculino</label>
                    <input
                        type="radio"
                        name="sex"
                        value="femenino"
                        id="female"
                    />
                    <label for="female">Femenino</label>
                </p>
                <p>
                    <label for="email">Correo Electrónico</label>
                    <input type="email" name="correo" id="email"

                </p>
                <p>
                    <input type="checkbox" name="ofertas" id="news">
                    <label for="news">Deseo recibir información sobre novedades y ofertas</label>
                </p>
                <p>
                    <input type="checkbox" name="condiciones" id="privacy">
                    <label for="privacy">Declaro haber leido y aceptar las condiciones generales del programa y la normativa sobre protección de datos</label>
                </p>
                <p>
                    <button>Enviar</button>
                </p>

            </form>
        </main>
    </body>
</html>
